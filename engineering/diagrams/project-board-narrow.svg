<svg xmlns="http://www.w3.org/2000/svg" width="440" height="430" viewBox="0 0 440 430" role="img" aria-labelledby="title desc">
  <title id="title">A schematic Project board</title>
  <desc id="desc">Six Status columns: Backlog, Ready, In progress, In review, Blocked and Done. Muted bars stand in for issue-card contents, with no titles, labels, priorities, identifiers or other readable task details. Robot icons identify agent work in In progress and In review. The Board view is filtered to open issues, so Done has no closed cards. The adjacent workflow explains how a task progresses and reaches completion. The phone layout reflows the six columns into three rows.</desc>
  <!-- Directly editable source. Card contents are intentionally abstract shapes; keep labels, open-only filter and README text equivalent synchronized. -->
  <defs>
    <symbol id="robot" viewBox="0 0 32 32">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 7 V4 M4 15 H2 V21 H4 M28 15 H30 V21 H28" />
        <rect x="5" y="8" width="22" height="20" rx="5" />
        <circle cx="11" cy="16" r="1.5" fill="currentColor" stroke="none" /><circle cx="21" cy="16" r="1.5" fill="currentColor" stroke="none" />
        <path d="M11 22 H21" />
      </g>
    </symbol>
  </defs>
  <rect width="440" height="430" fill="#F8FAFC" />
  <g font-family="Arial, Helvetica, sans-serif" fill="#0F172A">
  <text x="16" y="30" font-size="24" fill="#0F172A" font-weight="700">Project board</text>
  <rect x="16" y="48" width="198" height="116" rx="9" fill="#EDF2F7" stroke="#EDF2F7" stroke-width="1.4" />
  <text x="28" y="74" font-size="22" fill="#0F172A" font-weight="700">Backlog</text>
  <rect x="22" y="84" width="186" height="32" rx="6" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.4" />
  <rect x="32" y="93" width="119" height="5" rx="2.5" fill="#DCE3EC" />
  <rect x="32" y="105" width="141" height="4" rx="2" fill="#DCE3EC" />
  <rect x="22" y="124" width="186" height="30" rx="6" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.4" />
