  <rect x="242" y="145" width="108" height="4" rx="2" fill="#DCE3EC" />
  <rect x="16" y="172" width="198" height="116" rx="9" fill="#EDF2F7" stroke="#EDF2F7" stroke-width="1.4" />
  <text x="28" y="198" font-size="22" fill="#0F172A" font-weight="700">In progress</text>
  <rect x="22" y="208" width="186" height="32" rx="6" fill="#EAF3FF" stroke="#1971C2" stroke-width="1.4" />
