<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1038" viewBox="0 0 1360 1038" role="img" aria-labelledby="title desc">
<title id="title">The starter building blocks</title>
<desc id="desc">The complete starter groups guidance, issue handling and worktrees; Git hooks, the quality gate and browser testing; and the application, GitHub setup and delivery. Issue handling connects to task worktree creation; push hooks invoke the quality gate. Local builds, tests and GPU runs share workload coordination. The owner decides scope and authorizes merges and releases. These capabilities share code and configuration; they are not standalone packages.</desc>
<!-- Directly editable SVG. Keep both layouts and engineering/building-blocks.md synchronized. -->
