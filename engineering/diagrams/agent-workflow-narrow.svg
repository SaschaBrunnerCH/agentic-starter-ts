<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1260" viewBox="0 0 420 1260" role="img" aria-labelledby="title desc">
  <title id="title">How the agentic starter workflow fits together</title>
  <desc id="desc">An issue, shared instructions and tracked knowledge feed an agent working in an isolated worktree. Commit hooks, the push gate, the PR build and local browser evidence verify its changes. Failed checks return to the agent for fixes. The owner authorizes the exact commit before merge and cleanup. Handoffs preserve unfinished work.</desc>
  <!-- Editable SVG source. Keep the wide and narrow layouts and README text equivalent in sync. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
    <marker id="feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1971C2" />
    </marker>
  </defs>
  <rect width="420" height="1260" rx="20" fill="#F8FAFC" />
  <g font-family="Arial, Helvetica, sans-serif" fill="#0F172A">
<text x="24" y="40" font-size="26" fill="#0F172A" font-weight="700">The agent workflow</text>
<text x="24" y="70" font-size="18" fill="#475569">You decide. The agent implements.</text>
<text x="24" y="95" font-size="18" fill="#475569">Checks and approval control delivery.</text>
<text x="24" y="124" font-size="15" fill="#475569" font-weight="700">01  CONTEXT IN</text>
<rect x="24" y="140" width="372" height="278" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
<text x="44" y="169" font-size="21" fill="#0F172A" font-weight="700">A checkable issue</text>
<text x="44" y="194" font-size="18" fill="#475569">Owner sets goal and priority</text>
<text x="44" y="217" font-size="18" fill="#475569">“Done when” defines completion</text>
<text x="44" y="259" font-size="21" fill="#0F172A" font-weight="700">Shared instructions</text>
<text x="44" y="284" font-size="18" fill="#475569">AGENTS.md + CONTEXT.md</text>
<text x="44" y="307" font-size="18" fill="#475569">One rule source, shared terms</text>
<text x="44" y="349" font-size="21" fill="#0F172A" font-weight="700">Tracked knowledge</text>
<text x="44" y="374" font-size="18" fill="#475569">Guides, designs, research and ADRs</text>
<text x="44" y="397" font-size="18" fill="#475569">Read by task; keep lasting rationale</text>
<path d="M 44 234 H 376" fill="none" stroke="#475569" stroke-width="2" />
<path d="M 44 324 H 376" fill="none" stroke="#475569" stroke-width="2" />
<path d="M 210 418 V 470" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
<text x="24" y="456" font-size="15" fill="#475569" font-weight="700">02  AGENT WORK</text>
<rect x="24" y="470" width="372" height="226" rx="12" fill="#EAF3FC" stroke="#1971C2" stroke-width="1.5" />
<text x="44" y="506" font-size="26" fill="#145A96" font-weight="700">Your coding agent</text>
<text x="44" y="538" font-size="19" fill="#0F172A">Plan, change, test &amp; document</text>
<text x="44" y="566" font-size="19" fill="#0F172A">One issue, an isolated worktree</text>
<text x="44" y="598" font-size="18" fill="#145A96">pnpm task start &lt;issue&gt;</text>
<path d="M 44 620 H 376" fill="none" stroke="#475569" stroke-width="2" />
<text x="44" y="649" font-size="21" fill="#145A96" font-weight="700">Resumable handoff</text>
<text x="44" y="677" font-size="18" fill="#475569">State, evidence and next action</text>
<path d="M 210 696 V 748" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
<text x="24" y="734" font-size="15" fill="#475569" font-weight="700">03  VERIFICATION</text>
<rect x="24" y="748" width="372" height="180" rx="12" fill="#EFF9F1" stroke="#2F9E44" stroke-width="1.5" />
<text x="44" y="781" font-size="23" fill="#226F31" font-weight="700">Verify the change</text>
<text x="44" y="809" font-size="18" fill="#475569">Commit hooks + push gate</text>
<text x="44" y="834" font-size="18" fill="#475569">Same code/build gate in CI</text>
<text x="44" y="864" font-size="18" fill="#475569">Local GPU browser acceptance</text>
<text x="44" y="889" font-size="18" fill="#475569">Evidence reported on the PR</text>
<text x="44" y="915" font-size="17" fill="#145A96">Failed checks → agent fixes</text>
<path d="M 24 838 H 12 V 550 H 24" fill="none" stroke="#1971C2" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#feedback)" />
<path d="M 210 928 V 980" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
<text x="24" y="966" font-size="15" fill="#475569" font-weight="700">04  OWNER APPROVAL</text>
<rect x="24" y="980" width="372" height="100" rx="12" fill="#FFF4EB" stroke="#C05621" stroke-width="1.5" />
<text x="44" y="1014" font-size="23" fill="#9A451B" font-weight="700">Your yes, for this commit</text>
<text x="44" y="1042" font-size="18" fill="#475569">Current base + green PR build</text>
<text x="44" y="1066" font-size="18" fill="#475569">New commit → ask again</text>
<path d="M 210 1080 V 1132" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
<rect x="24" y="1132" width="372" height="92" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
<text x="44" y="1164" font-size="23" fill="#0F172A" font-weight="700">Merge, then clean up</text>
<text x="44" y="1190" font-size="18" fill="#475569">pnpm task merge</text>
<text x="44" y="1214" font-size="18" fill="#475569">pnpm task cleanup</text>
<text x="24" y="1248" font-size="17" fill="#475569">Same workflow across coding agents.</text>
</g></svg>
