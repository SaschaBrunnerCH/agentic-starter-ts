<svg xmlns="http://www.w3.org/2000/svg" width="440" height="2520" viewBox="0 0 440 2520" role="img" aria-labelledby="title desc">
  <title id="title">How we build with agentic-starter-ts</title>
  <desc id="desc">Context in: a checkable issue, shared instructions, on-demand guides and explicitly named skills, tracked knowledge and session handoffs. The coding agent plans, implements, tests and documents one issue in an isolated worktree. An optional owner-requested review returns read-only findings. Guardrails out: commit hooks, the push gate, the PR build, local GPU browser acceptance and the readiness check. Failed checks return to the agent for fixes. Human gates resolve decisions and authorize the exact commit on a current base with a green PR build, before merge and cleanup. Robot icons mark agent work or steps that can be delegated; person icons mark owner decisions or hands-on review. A preview app linked from the PR can be tried after a green build when previews are configured. Local tests, builds and browser acceptance share one execution slot across participating agent sessions; reading, planning and editing can continue concurrently. Overlapping resource-intensive runs can cause longer runtimes and timeouts. GitHub CI runs separately.</desc>
  <!-- Directly editable SVG source. Keep both layouts and the README text equivalent synchronized. -->
  <defs>
    <symbol id="robot" viewBox="0 0 32 32">
