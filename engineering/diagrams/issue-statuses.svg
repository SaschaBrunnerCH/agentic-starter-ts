<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 340" width="822" height="340" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="The statuses an issue passes through in the Project">
<title>The statuses an issue passes through in the Project</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/></marker><marker id="head-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f9e44"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="30" y="90" width="130" height="60" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<text x="95" y="120" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="95" dy="0">Backlog</tspan></text>
<rect x="188" y="90" width="130" height="60" rx="10" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/>
<text x="253" y="120" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="253" dy="0">Ready</tspan></text>
<rect x="346" y="90" width="130" height="60" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
<text x="411" y="120" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="411" dy="0">In progress</tspan></text>
<rect x="504" y="90" width="130" height="60" rx="10" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/>
<text x="569" y="120" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="569" dy="0">In review</tspan></text>
<rect x="662" y="90" width="130" height="60" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
<text x="727" y="120" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="727" dy="0">Done</tspan></text>
<rect x="301" y="240" width="220" height="60" rx="10" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/>
<text x="411" y="260" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="411" dy="0">Blocked: waits on a</tspan><tspan x="411" dy="20">dependency or decision</tspan></text>
<text x="95" y="181.875" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#495057"><tspan x="95" dy="0">accepted,</tspan><tspan x="95" dy="16.25">not next</tspan></text>
<text x="253" y="181.875" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#495057"><tspan x="253" dy="0">specified, unblocked,</tspan><tspan x="253" dy="16.25">has a readiness label</tspan></text>
<text x="569" y="181.875" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#495057"><tspan x="569" dy="0">pull request ready,</tspan><tspan x="569" dy="16.25">waits for the owner</tspan></text>
<text x="727" y="181.875" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#495057"><tspan x="727" dy="0">closed, criteria</tspan><tspan x="727" dy="16.25">satisfied</tspan></text>
<text x="411" y="36" font-size="15" text-anchor="middle" dominant-baseline="central" fill="#495057"><tspan x="411" dy="0">An issue moves left to right. At most four are In progress at once; epics are never Ready.</tspan></text>
<line x1="164.0" y1="120.0" x2="184.0" y2="120.0" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head)"/>
<line x1="322.0" y1="120.0" x2="342.0" y2="120.0" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head)"/>
<text x="332" y="74" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#495057"><tspan x="332" dy="0">claim</tspan></text>
<line x1="480.0" y1="120.0" x2="500.0" y2="120.0" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head)"/>
<line x1="638.0" y1="120.0" x2="658.0" y2="120.0" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head)"/>
<text x="648" y="74" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#495057"><tspan x="648" dy="0">merge</tspan></text>
<line x1="411.0" y1="154.0" x2="411.0" y2="236.0" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head)" marker-start="url(#head)"/>
</svg>
