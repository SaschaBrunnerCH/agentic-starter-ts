<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 640" width="840" height="640" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Four layers that stop a wrong change before it reaches main">
<title>Four layers that stop a wrong change before it reaches main</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/></marker><marker id="head-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f9e44"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="30" y="70" width="170" height="78" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
<text x="115" y="109" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="115" dy="0">Commit</tspan></text>
<rect x="270" y="70" width="540" height="78" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
<text x="540" y="99" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="540" dy="0">Hooks on the staged files:</tspan><tspan x="540" dy="20">format, lint fixes, secret scan, no AI attribution</tspan></text>
<rect x="30" y="182" width="170" height="78" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
<text x="115" y="221" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="115" dy="0">Push</tspan></text>
<rect x="270" y="182" width="540" height="78" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
<text x="540" y="211" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="540" dy="0">The whole gate: format, lint, types, unused code, secrets,</tspan><tspan x="540" dy="20">workflows, agent files, hooks, tests, build</tspan></text>
<rect x="30" y="294" width="170" height="78" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
<text x="115" y="333" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="115" dy="0">Pull request</tspan></text>
<rect x="270" y="294" width="540" height="78" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
<text x="540" y="323" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="540" dy="0">PR build: the same gate on a clean CI machine</tspan><tspan x="540" dy="20">Browser acceptance: local Chrome on a verified GPU</tspan></text>
<rect x="30" y="406" width="170" height="78" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
<text x="115" y="445" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="115" dy="0">Merge</tspan></text>
<rect x="270" y="406" width="540" height="78" rx="10" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/>
<text x="540" y="435" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="540" dy="0">Rulesets: green PR build on a current branch.</tspan><tspan x="540" dy="20">The owner's yes, recorded for that exact commit</tspan></text>
<rect x="30" y="518" width="780" height="60" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<text x="420" y="548" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="420" dy="0">main: only changes that passed all four</tspan></text>
<text x="420" y="34" font-size="15" text-anchor="middle" dominant-baseline="central" fill="#495057"><tspan x="420" dy="0">A change passes four layers. Each repeats the one before, so none depends on another having run.</tspan></text>
<line x1="115.0" y1="152.0" x2="115.0" y2="178.0" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head)"/>
<line x1="115.0" y1="264.0" x2="115.0" y2="290.0" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head)"/>
<line x1="115.0" y1="376.0" x2="115.0" y2="402.0" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head)"/>
<line x1="204.0" y1="109.0" x2="266.0" y2="109.0" stroke="#2f9e44" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#head-green)"/>
<line x1="204.0" y1="221.0" x2="266.0" y2="221.0" stroke="#2f9e44" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#head-green)"/>
<line x1="204.0" y1="333.0" x2="266.0" y2="333.0" stroke="#2f9e44" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#head-green)"/>
<line x1="204.0" y1="445.0" x2="266.0" y2="445.0" stroke="#2f9e44" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#head-green)"/>
</svg>
