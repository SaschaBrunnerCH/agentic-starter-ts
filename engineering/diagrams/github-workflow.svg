  <text x="616" y="408" font-size="18" fill="#0F172A" font-weight="700">Build in a worktree</text>
  <text x="584" y="443" font-size="16" fill="#475569">Claim + isolated branch</text>
  <text x="584" y="470" font-size="16" fill="#475569">Implement, test, document</text>
  <text x="584" y="497" font-size="16" fill="#475569">Commit hook + push gate</text>
  <text x="584" y="524" font-size="16" fill="#475569">Fix + rerun failed checks</text>
  <text x="584" y="565" font-size="16" fill="#475569">pnpm task start &lt;issue&gt;</text>
  <rect x="832" y="170" width="224" height="142" rx="10" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.5" />
  <rect x="844" y="182" width="200" height="36" rx="6" fill="#FFF0E6" stroke="#FFF0E6" stroke-width="1.5" />
  <text x="860" y="207" font-size="22" fill="#0F172A" font-weight="700">In review</text>
  <text x="848" y="252" font-size="18" fill="#475569">Ready pull request</text>
  <text x="848" y="280" font-size="16" fill="#475569">Await merge authorization</text>
