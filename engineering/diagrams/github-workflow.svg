  <text x="352" y="408" font-size="18" fill="#0F172A" font-weight="700">Order the work</text>
  <text x="320" y="443" font-size="16" fill="#475569">Agent proposes + updates</text>
  <text x="320" y="470" font-size="16" fill="#475569">Owner confirms Priority</text>
