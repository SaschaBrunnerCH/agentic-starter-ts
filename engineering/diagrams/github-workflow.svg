  <text x="320" y="565" font-size="16" fill="#475569">pnpm issue ready</text>
  <rect x="568" y="170" width="224" height="142" rx="10" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.5" />
  <rect x="580" y="182" width="200" height="36" rx="6" fill="#EAF3FF" stroke="#EAF3FF" stroke-width="1.5" />
  <text x="596" y="207" font-size="22" fill="#0F172A" font-weight="700">In progress</text>
  <text x="584" y="252" font-size="18" fill="#475569">Assigned and claimed</text>
  <text x="584" y="280" font-size="16" fill="#475569">At most 4 issues</text>
