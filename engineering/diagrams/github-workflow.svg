<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1194" viewBox="0 0 1360 1194" role="img" aria-labelledby="title desc">
  <title id="title">From a GitHub issue to a merged change</title>
  <desc id="desc">Robot icons mark work an agent can carry out or receive by delegation, including drafting issues, proposing an order, updating the Project, implementing, preparing a PR, trying the preview, fixing checks and merging after authorization. Person icons mark owner decisions or hands-on review. The owner decides scope and Priority and authorizes the exact merge head. A task moves through Project statuses Backlog, Ready, In progress, In review and Done. Blocked is below implementation, with separate parallel pause and resume arrows. A green PR build can publish a preview app when pnpm setup:previews has been completed; open its PR link and try the app before deciding to merge. Preview publication is automated, and previews do not replace required checks or owner authorization. Task commands update and read back Project fields. Local tests, builds and browser acceptance share one execution slot across participating agent sessions; reading, planning and editing can continue concurrently. Overlapping resource-intensive runs can cause longer runtimes and timeouts. GitHub CI runs separately.</desc>
