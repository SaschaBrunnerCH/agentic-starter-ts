  <text x="880" y="408" font-size="18" fill="#0F172A" font-weight="700">PR + verification</text>
  <text x="848" y="443" font-size="16" fill="#475569">Link: Closes #&lt;issue&gt;</text>
  <text x="848" y="470" font-size="16" fill="#475569">Green build; current base</text>
  <text x="848" y="497" font-size="16" fill="#475569">Local slot; browser evidence</text>
  <text x="848" y="524" font-size="16" fill="#475569">Preview app when set up</text>
