  <text x="1124" y="207" font-size="22" fill="#0F172A" font-weight="700">Done</text>
  <text x="1112" y="252" font-size="18" fill="#475569">Criteria satisfied</text>
  <text x="1112" y="280" font-size="16" fill="#475569">Closed issue + Status Done</text>
  <path d="M 1208 312 V 374" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#flow)" />
  <rect x="1096" y="374" width="224" height="218" rx="10" fill="#FFFFFF" stroke="#2F9E44" stroke-width="1.5" />
  <use href="#robot" x="1110" y="389" width="26" height="26" color="#1971C2" />
  <text x="1144" y="408" font-size="18" fill="#0F172A" font-weight="700">Merge + clean up</text>
  <text x="1112" y="443" font-size="15" fill="#475569">After owner’s exact-head yes</text>
  <text x="1112" y="470" font-size="15" fill="#475569">Merge; close the issue</text>
  <text x="1112" y="497" font-size="15" fill="#475569">Set Project Status Done</text>
  <text x="1112" y="524" font-size="15" fill="#475569">Remove worktree + branch</text>
  <text x="1112" y="544" font-size="15" fill="#475569">pnpm task merge &lt;pr&gt;</text>
  <text x="1112" y="568" font-size="15" fill="#475569">pnpm task cleanup &lt;pr&gt;</text>
  <path d="M 832 526 H 792" fill="none" stroke="#1971C2" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#agent)" />
  <path d="M 620 592 V 650" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#flow)" />
  <path d="M 744 650 V 592" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#flow)" />
  <text x="608" y="627" font-size="14" fill="#475569" text-anchor="end">pause</text>
  <text x="754" y="627" font-size="14" fill="#475569">resume</text>
  <rect x="568" y="650" width="224" height="138" rx="10" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.5" />
  <use href="#robot" x="582" y="665" width="26" height="26" color="#1971C2" />
  <text x="616" y="685" font-size="22" fill="#0F172A" font-weight="700">Blocked</text>
  <text x="584" y="718" font-size="17" fill="#475569">Record dependency</text>
  <text x="584" y="745" font-size="17" fill="#475569">or open decision.</text>
  <text x="584" y="774" font-size="17" fill="#475569">Resume when resolved.</text>
  <rect x="40" y="650" width="488" height="138" rx="10" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.5" />
  <text x="56" y="681" font-size="21" fill="#0F172A" font-weight="700">Who carries out the work?</text>
  <use href="#robot" x="56" y="695" width="28" height="28" color="#1971C2" />
  <text x="96" y="717" font-size="19" fill="#0F172A" font-weight="700">Agent work · can be delegated</text>
  <use href="#person" x="56" y="738" width="28" height="28" color="#C05621" />
  <text x="96" y="759" font-size="18" fill="#0F172A" font-weight="700">Owner decisions or hands-on review</text>
  <text x="96" y="780" font-size="16" fill="#475569">Issue drafts and Project updates can be delegated.</text>
  <path d="M 944 592 V 650" fill="none" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#preview)" />
  <rect x="832" y="650" width="488" height="138" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" />
  <rect x="844" y="662" width="464" height="28" rx="5" fill="#F2EBFF" stroke="#F2EBFF" stroke-width="1.5" />
  <text x="860" y="682" font-size="16" fill="#475569">PR preview · pr-&lt;number&gt;/ · when configured</text>
  <use href="#person" x="848" y="703" width="26" height="26" color="#C05621" />
  <use href="#robot" x="880" y="703" width="26" height="26" color="#1971C2" />
  <text x="918" y="726" font-size="23" fill="#0F172A" font-weight="700">Open and try the app</text>
  <text x="848" y="752" font-size="18" fill="#475569">Preview link on the PR after a green build.</text>
  <text x="848" y="777" font-size="16" fill="#475569">Requires pnpm setup:previews.</text>
  <path d="M 944 788 V 834" fill="none" stroke="#C05621" stroke-width="1.8" marker-end="url(#owner)" />
  <rect x="832" y="834" width="488" height="104" rx="10" fill="#FFF0E6" stroke="#C05621" stroke-width="1.5" />
  <use href="#person" x="846" y="850" width="28" height="28" color="#C05621" />
  <text x="884" y="870" font-size="23" fill="#C05621" font-weight="700">Owner authorizes the exact head</text>
  <text x="848" y="899" font-size="18" fill="#475569">Green build + current base + reviewed result.</text>
  <text x="848" y="926" font-size="18" fill="#475569">A new commit needs a new yes.</text>
  <path d="M 1320 882 H 1340 V 526 H 1320" fill="none" stroke="#C05621" stroke-width="1.8" marker-end="url(#owner)" />
  <path d="M 40 980 H 1320" stroke="#DCE3EC" />
  <text x="40" y="1011" font-size="18" fill="#475569">One issue moves across the statuses. You decide scope and Priority and authorize the exact merge head.</text>
  <text x="40" y="1041" font-size="18" fill="#475569">Task commands update and read back Project fields; closing an issue alone does not guarantee a Status change.</text>
  <path d="M 40 1072 H 1320" stroke="#DCE3EC" />
  <text x="40" y="1104" font-size="22" fill="#1971C2" font-weight="700">Local workloads share one slot</text>
  <text x="40" y="1136" font-size="18" fill="#475569">Tests, builds and browser checks take turns. Planning and editing continue concurrently; GitHub CI runs separately.</text>
  <text x="40" y="1168" font-size="18" fill="#475569">Competing runs can lengthen runtimes, pressure memory and cause timeouts.</text>
  </g>
</svg>
