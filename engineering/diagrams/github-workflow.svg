  <text x="320" y="252" font-size="18" fill="#475569">Specified + unblocked</text>
  <text x="320" y="280" font-size="16" fill="#475569">Ready for an agent</text>
  <path d="M 528 242 H 568" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#flow)" />
  <path d="M 416 312 V 374" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#flow)" />
