  <text x="702" y="480" font-size="20" fill="#C05621" font-weight="700">Human gates</text>
  <text x="668" y="512" font-size="18" fill="#475569">Resolve decisions</text>
  <text x="668" y="538" font-size="18" fill="#475569">Current base</text>
  <text x="668" y="564" font-size="18" fill="#475569">Green PR build</text>
  <text x="668" y="590" font-size="18" fill="#475569">Yes for this commit</text>
  <text x="668" y="620" font-size="17" fill="#475569">New commit → new yes</text>
  <path d="M 1120 862 V 898 H 892 V 288 H 864" fill="none" stroke="#1971C2" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#agent)" />
  <text x="970" y="887" font-size="18" fill="#475569">fail → agent fixes</text>
  <text x="448" y="682" font-size="16" fill="#475569">Review adds evidence; the owner authorizes the merge.</text>
  <text x="448" y="710" font-size="16" fill="#475569">Skills start only when a person names them.</text>
  <path d="M 40 934 H 1320" stroke="#DCE3EC" stroke-width="1" />
  <text x="40" y="965" font-size="22" fill="#1971C2" font-weight="700">Ready PR → owner’s yes for the exact commit → merge → cleanup</text>
  <text x="40" y="995" font-size="17" fill="#475569">pnpm task ready &lt;pr&gt;   ·   pnpm task merge &lt;pr&gt; --authorized-by-owner --head &lt;sha&gt;   ·   pnpm task cleanup &lt;pr&gt;</text>
    <use href="#robot" x="40" y="1022" width="26" height="26" color="#1971C2" />
  <text x="80" y="1044" font-size="18" fill="#475569">Agent work · can be delegated</text>
  <use href="#person" x="512" y="1022" width="26" height="26" color="#C05621" />
  <text x="552" y="1044" font-size="18" fill="#475569">Owner decisions / hands-on review</text>
