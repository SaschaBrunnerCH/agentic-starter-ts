<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1076" viewBox="0 0 1360 1076" role="img" aria-labelledby="title desc">
  <title id="title">How we build with agentic-starter-ts</title>
  <desc id="desc">Context in: a checkable issue, shared instructions, on-demand guides and explicitly named skills, tracked knowledge and session handoffs. The coding agent plans, implements, tests and documents one issue in an isolated worktree. An optional owner-requested review returns read-only findings. Guardrails out: commit hooks, the push gate, the PR build, local GPU browser acceptance and the readiness check. Failed checks return to the agent for fixes. Human gates resolve decisions and authorize the exact commit on a current base with a green PR build, before merge and cleanup. Robot icons mark agent work or steps that can be delegated; person icons mark owner decisions or hands-on review. A preview app linked from the PR can be tried after a green build when previews are configured.</desc>
  <!-- Directly editable SVG source. Keep both layouts and the README text equivalent synchronized. -->
  <defs>
    <symbol id="robot" viewBox="0 0 32 32">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 7 V4 M4 15 H2 V21 H4 M28 15 H30 V21 H28" />
        <rect x="5" y="8" width="22" height="20" rx="5" />
        <circle cx="11" cy="16" r="1.5" fill="currentColor" stroke="none" /><circle cx="21" cy="16" r="1.5" fill="currentColor" stroke="none" />
        <path d="M11 22 H21" />
      </g>
    </symbol>
    <symbol id="person" viewBox="0 0 32 32">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="16" cy="9" r="5" /><path d="M6 28 V24 A10 10 0 0 1 26 24 V28 Z" />
      </g>
    </symbol>
    <marker id="agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1971C2" />
    </marker>
    <marker id="owner" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C05621" />
    </marker>
  </defs>
  <rect width="1360" height="1076" fill="#F8FAFC" />
  <g font-family="Arial, Helvetica, sans-serif" fill="#0F172A">
  <text x="40" y="62" font-size="37" fill="#0F172A" font-weight="700">How we build with agentic-starter-ts</text>
  <rect x="0" y="86" width="152" height="14" rx="7" fill="#1971C2" stroke="#1971C2" stroke-width="1.4" />
  <text x="40" y="134" font-size="15" fill="#475569" font-weight="700">CONTEXT IN</text>
  <text x="448" y="134" font-size="15" fill="#475569" font-weight="700">AGENT</text>
  <text x="920" y="134" font-size="15" fill="#475569" font-weight="700">GUARDRAILS OUT</text>
  <rect x="40" y="158" width="352" height="92" rx="7" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.4" />
  <use href="#person" x="56" y="165" width="26" height="26" color="#C05621" />
  <text x="90" y="188" font-size="22" fill="#0F172A" font-weight="700">Your request</text>
  <text x="56" y="216" font-size="19" fill="#475569">Issue + checkable “Done when” criteria</text>
  <rect x="40" y="278" width="352" height="438" rx="17" fill="#F8FAFC" stroke="#DCE3EC" stroke-width="1.4" />
  <rect x="50" y="288" width="332" height="100" rx="7" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.4" />
  <text x="66" y="318" font-size="22" fill="#0F172A" font-weight="700">Shared instructions</text>
  <text x="66" y="346" font-size="17" fill="#475569">AGENTS.md: one source of rules</text>
  <text x="66" y="371" font-size="17" fill="#475569">CONTEXT.md: shared vocabulary</text>
  <rect x="50" y="394" width="332" height="100" rx="7" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.4" />
  <text x="66" y="424" font-size="22" fill="#0F172A" font-weight="700">On demand</text>
  <text x="66" y="452" font-size="17" fill="#475569">Task, verification and browser guides</text>
  <rect x="66" y="462" width="68" height="24" rx="12" fill="#EAF3FF" stroke="#EAF3FF" stroke-width="1.4" />
  <text x="100" y="479" font-size="15" fill="#0F172A" font-weight="700" text-anchor="middle">review</text>
  <rect x="142" y="462" width="56" height="24" rx="12" fill="#EAF3FF" stroke="#EAF3FF" stroke-width="1.4" />
  <text x="170" y="479" font-size="15" fill="#0F172A" font-weight="700" text-anchor="middle">issue</text>
  <text x="210" y="479" font-size="14" fill="#475569">only when named</text>
  <rect x="50" y="500" width="332" height="100" rx="7" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.4" />
  <text x="66" y="530" font-size="22" fill="#0F172A" font-weight="700">Knowledge store</text>
  <text x="66" y="558" font-size="17" fill="#475569">Tracked designs, research and ADRs</text>
  <text x="66" y="583" font-size="17" fill="#475569">Lasting findings stay in the repository</text>
  <rect x="50" y="606" width="332" height="100" rx="7" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.4" />
  <use href="#robot" x="66" y="613" width="26" height="26" color="#1971C2" />
  <text x="100" y="636" font-size="22" fill="#0F172A" font-weight="700">Session handoff</text>
  <text x="66" y="664" font-size="17" fill="#475569">State, evidence and next action</text>
  <text x="66" y="689" font-size="17" fill="#475569">Resume work with recorded context</text>
