  <path d="M 392 514 L 448 288" fill="none" stroke="#1971C2" stroke-width="1.8" marker-end="url(#agent)" />
  <rect x="448" y="166" width="416" height="156" rx="7" fill="#1971C2" stroke="#1971C2" stroke-width="1.4" />
  <use href="#robot" x="500" y="181" width="32" height="32" color="#FFFFFF" />
  <text x="656" y="210" font-size="34" fill="#FFFFFF" font-weight="700" text-anchor="middle">Coding agent</text>
  <text x="656" y="247" font-size="20" fill="#FFFFFF" text-anchor="middle">Plans, implements, tests and documents</text>
  <text x="656" y="278" font-size="19" fill="#FFFFFF" text-anchor="middle">One issue · isolated branch and worktree</text>
  <text x="656" y="304" font-size="18" fill="#FFFFFF" text-anchor="middle">pnpm task start &lt;issue&gt;</text>
  <path d="M 864 204 H 920" fill="none" stroke="#1971C2" stroke-width="1.8" marker-end="url(#agent)" />
  <text x="892" y="152" font-size="14" fill="#475569" text-anchor="middle">every change</text>
  <rect x="920" y="158" width="400" height="92" rx="7" fill="#FFFFFF" stroke="#2F9E44" stroke-width="1.4" />
  <text x="936" y="188" font-size="22" fill="#0F172A" font-weight="700">Commit hooks</text>
  <text x="936" y="216" font-size="18" fill="#475569">Format, staged lint and secret scan</text>
  <rect x="920" y="262" width="400" height="140" rx="7" fill="#FFFFFF" stroke="#2F9E44" stroke-width="1.4" />
  <text x="936" y="292" font-size="22" fill="#0F172A" font-weight="700">Push gate</text>
  <text x="936" y="320" font-size="18" fill="#475569">Types, lint, unit tests and coverage</text>
  <text x="936" y="345" font-size="18" fill="#475569">Links, licences, secrets and workflows</text>
  <text x="936" y="370" font-size="18" fill="#475569">Production build and size budget</text>
  <rect x="920" y="414" width="400" height="92" rx="7" fill="#FFFFFF" stroke="#2F9E44" stroke-width="1.4" />
  <text x="936" y="444" font-size="22" fill="#0F172A" font-weight="700">PR build</text>
  <text x="936" y="472" font-size="18" fill="#475569">Repeats the same code/build gate</text>
  <rect x="920" y="518" width="400" height="104" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4" />
  <rect x="932" y="530" width="376" height="26" rx="7" fill="#F2EBFF" stroke="#F2EBFF" stroke-width="1.4" />
  <text x="944" y="549" font-size="16" fill="#475569">PR preview · when configured</text>
  <use href="#person" x="936" y="566" width="24" height="24" color="#C05621" />
  <use href="#robot" x="968" y="566" width="24" height="24" color="#1971C2" />
  <text x="1002" y="586" font-size="21" fill="#0F172A" font-weight="700">Open and try the app</text>
  <text x="936" y="612" font-size="16" fill="#475569">Green build · pnpm setup:previews.</text>
  <rect x="920" y="634" width="400" height="116" rx="7" fill="#FFFFFF" stroke="#2F9E44" stroke-width="1.4" />
  <use href="#robot" x="936" y="641" width="26" height="26" color="#1971C2" />
  <text x="970" y="664" font-size="22" fill="#0F172A" font-weight="700">Local browser acceptance</text>
  <text x="936" y="692" font-size="18" fill="#475569">Chrome on a verified GPU + axe</text>
  <text x="936" y="717" font-size="18" fill="#475569">Evidence on the PR, separate from CI</text>
  <rect x="920" y="762" width="400" height="100" rx="7" fill="#FFFFFF" stroke="#2F9E44" stroke-width="1.4" />
  <use href="#robot" x="936" y="769" width="26" height="26" color="#1971C2" />
  <text x="970" y="792" font-size="22" fill="#0F172A" font-weight="700">Readiness check</text>
  <text x="936" y="820" font-size="18" fill="#475569">pnpm task ready &lt;pr&gt;</text>
  <text x="936" y="845" font-size="18" fill="#475569">Checks the head, base and PR build</text>
