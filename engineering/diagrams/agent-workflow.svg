  <text x="702" y="380" font-size="15" fill="#475569" text-anchor="end">ready PR</text>
  <text x="830" y="397" font-size="15" fill="#475569">sign-off</text>
  <rect x="652" y="448" width="212" height="190" rx="7" fill="#FFF0E6" stroke="#C05621" stroke-width="1.4" />
