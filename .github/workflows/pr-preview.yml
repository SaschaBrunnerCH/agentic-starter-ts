name: PR preview

# Trusted main owns admission, publication and reconciliation. No checkout or
# repository code runs with the preview key; candidate bytes remain data.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["PR build"]
    types: [completed]
  pull_request_target:
    types: [closed]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  admit:
    name: Identify the preview operation
    if: >-
      vars.PREVIEWS_REPOSITORY != '' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      number: ${{ steps.pull.outputs.number }}
      group: ${{ steps.pull.outputs.group }}
    steps:
      - name: Find the pull request
        id: pull
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CLOSED: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -n "$CLOSED" ]; then
            case "$CLOSED" in *[!0-9]*) exit 1;; esac
            echo "group=pr-$CLOSED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$HEAD_SHA" ]; then
            echo "group=reconciliation" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          found="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f "head=${GITHUB_REPOSITORY_OWNER}:${HEAD_BRANCH}" \
            --jq '.[0] | select(. != null) | "\(.number) \(.head.sha)"')"
          number="${found%% *}"
          head="${found#* }"
          case "$number" in
            ''|*[!0-9]*) echo "group=reconciliation" >> "$GITHUB_OUTPUT"; exit 0;;
          esac
          echo "group=pr-$number" >> "$GITHUB_OUTPUT"
          if [ "$head" != "$HEAD_SHA" ]; then exit 0; fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

  publish:
    name: Synchronize previews
    needs: [admit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pull-requests: write
    environment: previews
    # Closure and publication of the same PR share ordering. Only superseded
    # work for that PR can replace its pending job; unrelated PRs stay independent.
    concurrency:
      group: previews-${{ needs.admit.outputs.group }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      PREVIEWS_REPOSITORY: ${{ vars.PREVIEWS_REPOSITORY }}
      PREVIEWS_URL: ${{ vars.PREVIEWS_URL }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Download the build
        if: needs.admit.outputs.number != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Synchronize preview state
        id: sync
        env:
          PULL_REQUEST: ${{ needs.admit.outputs.number }}
          DEPLOY_KEY: ${{ secrets.PREVIEWS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          preview_ssh_directory="$(mktemp -d "${RUNNER_TEMP:?}/preview-ssh.XXXXXX")"
          trap 'rm -rf "$preview_ssh_directory"' EXIT
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$preview_ssh_directory/known_hosts"
          install -m 600 /dev/null "$preview_ssh_directory/key"
          printf '%s\n' "$DEPLOY_KEY" > "$preview_ssh_directory/key"
          printf -v GIT_SSH_COMMAND 'ssh -i %q -o IdentitiesOnly=yes -o UserKnownHostsFile=%q' "$preview_ssh_directory/key" "$preview_ssh_directory/known_hosts"
          export GIT_SSH_COMMAND
          git clone --quiet --depth 1 --branch gh-pages "git@github.com:$PREVIEWS_REPOSITORY.git" previews
          cd previews
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          reconcile() {
            for directory in pr-*; do
              [ -d "$directory" ] || continue
              number="${directory#pr-}"
              case "$number" in ''|*[!0-9]*) continue;; esac
              state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq .state)" || return 1
              case "$state" in
                open) ;;
                closed)
                  git rm -r -f --quiet --ignore-unmatch -- "$directory" || return 1
                  if [ "$number" = "$PULL_REQUEST" ]; then copied=false; fi
                  ;;
                *) echo "::error::Unknown PR state; previews retained." >&2; return 1;;
              esac
            done
          }
          current() {
            local facts state head
            facts="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" --jq '[.state, .head.sha] | @tsv')" || return 2
            IFS=$'\t' read -r state head <<< "$facts"
            case "$state" in open|closed) ;; *) return 2;; esac
            if [ "${#head}" != 40 ]; then return 2; fi
            case "$head" in *[!0-9a-f]*) return 2;; esac
            [ "$state" = open ] && [ "$head" = "$HEAD_SHA" ]
          }
          copied=false
          reconcile
          case "$PULL_REQUEST" in
            '') ;;
            *[!0-9]*) echo "::error::Invalid pull request number." >&2; exit 1;;
            *)
              if current; then
                rm -rf "pr-$PULL_REQUEST"
                cp -R ../site "pr-$PULL_REQUEST"
                copied=true
              else
                result=$?
                if [ "$result" != 1 ]; then exit "$result"; fi
              fi
              ;;
          esac
          git add -A
          for _ in 1 2 3 4 5; do
            reconcile
            if [ -n "$PULL_REQUEST" ]; then
              if current; then :; else
                result=$?
                if [ "$result" != 1 ]; then exit "$result"; fi
                git rm -r -f --quiet --ignore-unmatch -- "pr-$PULL_REQUEST"
                copied=false
              fi
            fi
            if ! git diff --cached --quiet; then
              git commit --quiet -m "Synchronize PR previews"
            fi
            if git push --quiet origin gh-pages; then
              # Closure or a newer head may race the push. Reconcile again before
              # reporting success; another iteration publishes any required removal.
              reconcile
              if [ -n "$PULL_REQUEST" ]; then
                if current; then :; else
                  result=$?
                  if [ "$result" != 1 ]; then exit "$result"; fi
                  git rm -r -f --quiet --ignore-unmatch -- "pr-$PULL_REQUEST"
                  copied=false
                fi
              fi
              if git diff --cached --quiet; then
                if [ "$copied" = true ]; then echo "published=$PULL_REQUEST" >> "$GITHUB_OUTPUT"; fi
                exit 0
              fi
            else
              git pull --quiet --rebase origin gh-pages
            fi
          done
          echo "::error::Preview state did not converge; no current preview is reported." >&2
          exit 1

      - name: Link the preview on the pull request
        if: steps.sync.outputs.published != ''
        env:
          PULL_REQUEST: ${{ steps.sync.outputs.published }}
        run: |
          set -euo pipefail
          facts="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" --jq '[.state, .head.sha] | @tsv')"
          IFS=$'\t' read -r state head <<< "$facts"
          if [ "$state" != open ] || [ "$head" != "$HEAD_SHA" ]; then exit 0; fi
          url="${PREVIEWS_URL%/}/pr-$PULL_REQUEST/"
          body="<!-- preview -->
          Preview of ${HEAD_SHA:0:8}: $url
          GitHub Pages may take a minute to serve a new commit."
          comment="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST/comments" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- preview -->")))][0].id // empty')"
          if [ -n "$comment" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST/comments" -f body="$body" > /dev/null
          fi
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
