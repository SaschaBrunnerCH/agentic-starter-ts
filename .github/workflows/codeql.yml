name: CodeQL

# Static security analysis of the TypeScript and the workflows. GitHub offers code
# scanning free for public repositories; a private one needs GitHub Code Security, so
# the job is skipped there and Oxlint's security rules in the gate remain the analysis.
# See engineering/agents/local-verification.md.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "11 5 * * 1"

permissions: {}

jobs:
  analyze:
    name: Analyze
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialise CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
