name: PR build

on:
  pull_request:
  workflow_dispatch:
    inputs:
      browser-tests:
        description: Run the browser tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, so checkout and install are paid once: GitHub bills each job by the
  # started minute. Its name is the one required status of the main ruleset.
  pr-build:
    name: PR build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # check:dependencies compares the lockfile with origin/main.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      # The pnpm version that package.json pins in packageManager.
      - name: Install pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      # Only the PR build caches packages; deploy and release builds install from the
      # registry, so a cache written by a pull request never reaches what is published.
      - name: Find the pnpm store
        id: store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same list the pre-push hook runs; see scripts/run-local-checks.ts.
      - name: Run all checks
        run: pnpm check:push

      # Browser tests run on the developer's machine by default, on its GPU, and are
      # reported in the pull request. The repository variable BROWSER_TESTS_IN_CI=true
      # runs them here for every pull request; a manual run can ask for them once.
      # This runner has no GPU, so a run here checks function, not speed.
      - name: Note where the browser tests ran
        if: vars.BROWSER_TESTS_IN_CI != 'true' && inputs.browser-tests != true
        run: echo "Browser tests are off in CI (BROWSER_TESTS_IN_CI); the pull request reports a local run." >> "$GITHUB_STEP_SUMMARY"

      - name: Install the browser
        if: vars.BROWSER_TESTS_IN_CI == 'true' || inputs.browser-tests == true
        run: pnpm test:browser:install

      # The build check:push made, which the preview workflow publishes; it runs no code from it.
      - name: Keep the build for the preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist
          if-no-files-found: error
          retention-days: 3

      - name: Test the build in a local browser
        if: vars.BROWSER_TESTS_IN_CI == 'true' || inputs.browser-tests == true
        run: pnpm test:browser

      # Pages and previews serve the build below a path such as /<repository>/.
      - name: Test the build under a sub-path
        if: vars.BROWSER_TESTS_IN_CI == 'true' || inputs.browser-tests == true
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4180 --strictPort --base /app/ &
          started=false
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/4180) 2>/dev/null; then
              started=true
              break
            fi
            sleep 1
          done
          if [ "$started" != true ]; then
            echo "::error::The preview server did not start."
            exit 1
          fi
          BROWSER_TEST_BASE_URL=http://127.0.0.1:4180/app/ pnpm test:browser

      - name: Keep traces of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
