name: PR build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, so checkout and install are paid once: GitHub bills each job by the
  # started minute. Its name is the one required status of the main ruleset.
  pr-build:
    name: PR build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # check:dependencies compares the lockfile with origin/main.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      # The pnpm version that package.json pins in packageManager.
      - name: Install pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      # Only the PR build caches packages; deploy and release builds install from the
      # registry, so a cache written by a pull request never reaches what is published.
      - name: Find the pnpm store
        id: store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same list the pre-push hook runs; see scripts/checks/run-local-checks.ts.
      - name: Run all checks
        run: pnpm check:push

      - name: Note local browser acceptance
        run: echo "Browser acceptance runs locally in Chrome on a verified GPU; the PR reports the tested commit, renderer and results." >> "$GITHUB_STEP_SUMMARY"

      # The build check:push made, which the preview workflow publishes; it runs no code from it.
      - name: Keep the build for the preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist
          if-no-files-found: error
          retention-days: 3
